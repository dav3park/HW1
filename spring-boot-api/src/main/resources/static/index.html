<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Neural Face Architecture</title>
    <!-- 공상과학/사이버펑크 무드를 위한 모노스페이스 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --grid-color: rgba(0, 255, 204, 0.05);
            --primary-cyan: #00ffcc;
            --primary-pink: #ff00ff;
            --text-color: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        header {
            padding: 20px 40px;
            border-bottom: 1px solid rgba(0, 255, 204, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,255,204,0.05), transparent);
        }
        .logo { font-size: 1.5rem; color: var(--primary-cyan); letter-spacing: 4px; text-shadow: 0 0 10px var(--primary-cyan); }
        .status { font-size: 0.9rem; color: #666; display: flex; align-items: center; gap: 8px; }
        .blink { width: 10px; height: 10px; background: var(--primary-cyan); border-radius: 50%; box-shadow: 0 0 10px var(--primary-cyan); animation: blinker 1s linear infinite; }

        /* Main Layout */
        .dashboard {
            display: flex;
            flex: 1;
            padding: 40px;
            gap: 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Left: Target Upload / Scan Area */
        .target-module {
            flex: 1;
            border: 1px solid var(--primary-cyan);
            border-radius: 8px;
            position: relative;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,255,204,0.1);
        }

        .target-module::before, .target-module::after {
            content: ''; position: absolute; width: 20px; height: 20px; border-style: solid; border-color: var(--primary-cyan);
        }
        .target-module::before { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
        .target-module::after { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

        .upload-layer {
            position: absolute;
            z-index: 10;
            text-align: center;
            cursor: pointer;
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: background 0.3s;
        }
        .upload-layer:hover { background: rgba(0, 255, 204, 0.1); }
        .upload-layer input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        h2.prompt { color: var(--primary-cyan); letter-spacing: 2px; text-transform: uppercase; font-size: 1.2rem; margin-bottom: 10px;}
        .sub-prompt { color: #888; font-size: 0.8rem; }

        #targetImage { width: 100%; height: 100%; object-fit: contain; display: none; z-index: 1; opacity: 0.7; filter: grayscale(20%) contrast(1.2); }

        /* The Scanner Laser */
        .scanner-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: var(--primary-cyan);
            box-shadow: 0 0 15px 5px rgba(0, 255, 204, 0.6);
            z-index: 5;
            display: none;
            animation: scan 2s ease-in-out infinite alternate;
        }

        /* Right: Analysis Data */
        .data-module {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .data-panel {
            flex: 1;
            border: 1px solid rgba(255, 0, 255, 0.5);
            border-radius: 8px;
            background: rgba(20, 0, 20, 0.4);
            padding: 30px;
            box-shadow: inset 0 0 20px rgba(255,0,255,0.05);
            display: flex;
            flex-direction: column;
        }

        .panel-header { font-size: 1rem; color: var(--primary-pink); border-bottom: 1px dashed var(--primary-pink); padding-bottom: 10px; margin-bottom: 25px; letter-spacing: 2px; text-transform: uppercase; }

        .metric-group { margin-bottom: 30px; display: none; }
        .metric-label { font-size: 0.8rem; color: #888; margin-bottom: 5px; text-transform: uppercase;}
        .metric-value { font-size: 2rem; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); margin-bottom: 15px; letter-spacing: 1px; }

        .hud-bar-container { width: 100%; height: 4px; background: #222; position: relative; }
        .hud-bar-fill { height: 100%; width: 0%; background: var(--primary-cyan); box-shadow: 0 0 10px var(--primary-cyan); transition: width 1.5s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .hud-bar-text { position: absolute; right: 0; top: -20px; font-size: 0.8rem; color: var(--primary-cyan); }

        .terminal-log {
            height: 150px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.8);
            padding: 15px;
            font-size: 0.8rem;
            color: #0f0;
            overflow-y: auto;
            border-radius: 4px;
        }
        .log-entry { margin-bottom: 5px; opacity: 0.8; }
        .log-error { color: #f00; }

        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
        @keyframes blinker { 50% { opacity: 0; } }
        
        .glitch-effect { animation: glitch 0.2s linear infinite; }
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 1px) }
            40% { transform: translate(-1px, -1px) }
            60% { transform: translate(2px, 1px) }
            80% { transform: translate(1px, -1px) }
            100% { transform: translate(0) }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">NEXUS_VISION // V.2.0</div>
    <div class="status">
        <div class="blink"></div>
        <span>SYSTEM ONLINE : AWAITING TARGET INPUT</span>
    </div>
</header>

<div class="dashboard">
    <!-- TARGET UPLOAD -->
    <div class="target-module" id="targetModule">
        <div class="upload-layer" id="uploadLayer">
            <h2 class="prompt">[ ACQUIRE TARGET ]</h2>
            <div class="sub-prompt">Click or drag image pattern to initialize link</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        <img id="targetImage" src="" alt="Target">
        <div class="scanner-line" id="scannerLine"></div>
    </div>

    <!-- ANALYSIS DATA -->
    <div class="data-module">
        <!-- Main Analysis Panel -->
        <div class="data-panel">
            <div class="panel-header">Neural Subject Analysis</div>
            
            <!-- Gender Metric -->
            <div class="metric-group" id="genderGroup">
                <div class="metric-label">Identified Gender Class</div>
                <div class="metric-value" id="genderValue">--</div>
                <div class="hud-bar-container">
                    <div class="hud-bar-text" id="genderConfText">0.0%</div>
                    <div class="hud-bar-fill" id="genderBar"></div>
                </div>
            </div>

            <!-- Race Metric -->
            <div class="metric-group" id="raceGroup">
                <div class="metric-label">Identified Ethnographic Origin</div>
                <div class="metric-value" id="raceValue">--</div>
                <div class="hud-bar-container">
                    <div class="hud-bar-text" id="raceConfText" style="color: var(--primary-pink)">0.0%</div>
                    <div class="hud-bar-fill" id="raceBar" style="background: var(--primary-pink); box-shadow: 0 0 10px var(--primary-pink);"></div>
                </div>
            </div>
        </div>

        <!-- Terminal Logs -->
        <div class="terminal-log" id="terminalLog">
            <div class="log-entry">> System initialized. Waiting for external image payload.</div>
        </div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const targetImage = document.getElementById('targetImage');
    const uploadLayer = document.getElementById('uploadLayer');
    const scannerLine = document.getElementById('scannerLine');
    const terminalLog = document.getElementById('terminalLog');
    
    // Result elements
    const genderGroup = document.getElementById('genderGroup');
    const genderValue = document.getElementById('genderValue');
    const genderBar = document.getElementById('genderBar');
    const genderConfText = document.getElementById('genderConfText');

    const raceGroup = document.getElementById('raceGroup');
    const raceValue = document.getElementById('raceValue');
    const raceBar = document.getElementById('raceBar');
    const raceConfText = document.getElementById('raceConfText');

    function logTerminal(msg, isError = false) {
        const div = document.createElement('div');
        div.className = isError ? 'log-entry log-error' : 'log-entry';
        div.innerText = `> [${new Date().toISOString().split('T')[1].slice(0,-1)}] ${msg}`;
        terminalLog.appendChild(div);
        terminalLog.scrollTop = terminalLog.scrollHeight;
    }

    fileInput.addEventListener('change', handleUpload);

    async function handleUpload() {
        if (!fileInput.files.length) return;
        const file = fileInput.files[0];

        // Reset UI
        logTerminal(`Target acquired: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`);
        targetImage.src = URL.createObjectURL(file);
        targetImage.style.display = 'block';
        
        uploadLayer.style.display = 'none';
        scannerLine.style.display = 'block';
        
        genderGroup.style.display = 'none';
        raceGroup.style.display = 'none';
        genderBar.style.width = '0%';
        raceBar.style.width = '0%';
        targetImage.classList.add('glitch-effect');

        logTerminal("Initiating Neural Link to ML Backend (Port 8000)...");
        logTerminal("Running DeepFace Deep Learning inference algorithms...");

        const formData = new FormData();
        formData.append("file", file);

        try {
            const response = await fetch('http://localhost:8000/analyze', { method: 'POST', body: formData });
            const data = await response.json();
            
            scannerLine.style.display = 'none';
            targetImage.classList.remove('glitch-effect');
            
            if (!response.ok) {
                logTerminal(`ML Backend Error: ${data.detail || 'Unknown anomaly'}`, true);
                uploadLayer.style.display = 'flex';
                targetImage.style.display = 'none';
                return;
            }

            logTerminal("Analysis Complete. Parsing response payload...");

            // Output Results
            genderGroup.style.display = 'block';
            raceGroup.style.display = 'block';

            // Gender Handling
            genderValue.innerText = data.dominant_gender.toUpperCase();
            const confGender = data.dominant_gender === 'Man' ? data.gender_confidence.Man : data.gender_confidence.Woman;
            
            // Race Handling
            raceValue.innerText = data.dominant_race.toUpperCase();
            const confRace = data.race_confidence[data.dominant_race];
            
            // Render Animations
            setTimeout(() => {
                genderBar.style.width = `${confGender.toFixed(1)}%`;
                raceBar.style.width = `${confRace.toFixed(1)}%`;
            }, 100);
            
            genderConfText.innerText = `${confGender.toFixed(2)}%`;
            raceConfText.innerText = `${Math.min(100, confRace).toFixed(2)}%`;
            
            logTerminal(`Classification Output --> [Gender: ${data.dominant_gender}] [Race: ${data.dominant_race}]`);

        } catch (err) {
            scannerLine.style.display = 'none';
            targetImage.classList.remove('glitch-effect');
            uploadLayer.style.display = 'flex';
            targetImage.style.display = 'none';
            logTerminal("CRITICAL FAILURE: Cannot establish connection to ML Server on localhost:8000", true);
        }
    }

    // Drag events for target module
    const targetModule = document.getElementById('targetModule');
    targetModule.addEventListener('dragover', (e) => { e.preventDefault(); targetModule.style.borderColor = "#ff00ff"; });
    targetModule.addEventListener('dragleave', () => { targetModule.style.borderColor = "#00ffcc"; });
    targetModule.addEventListener('drop', (e) => { 
        e.preventDefault(); 
        targetModule.style.borderColor = "#00ffcc";
        if (e.dataTransfer.files.length > 0) {
            fileInput.files = e.dataTransfer.files; 
            handleUpload(); 
        }
    });

</script>

</body>
</html>
